<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>나만의 관심종목 대시보드</title>
<style>
  /* Design tokens ported from DESIGN-discord.md — single dark-indigo theme, no light variant (brand has none). */
  :root {
    color-scheme: dark;
    --canvas:         #0a0d3a;
    --surface-indigo: #1e2353;
    --surface-onyx:   #23272a;
    --primary:        #5865f2;
    --on-primary:     #ffffff;
    --green:          #35ed7e;
    --magenta:        #ec48bd;
    --link:           #00b0f4;
    --ink:            #ffffff;
    --ink-dark:       #000000;
    --muted:          rgba(255,255,255,0.6);
    --hairline:       #23272a;
    --radius-control: 16px;
    --radius-btn:     12px;
    --radius-card:    40px;
    --radius-chip:    14px;
    --radius-pill:    50px;
    --shadow-soft:    0 3px 68px rgba(69,42,124,0.35);
    --font-display:   'Space Grotesk', 'Hanken Grotesk', -apple-system, system-ui, sans-serif;
    --font-sans:      'Inter', 'Plus Jakarta Sans', -apple-system, system-ui, "Segoe UI", sans-serif;
  }

  /* 라이트 테마 (data-theme="light") — 액센트 컬러는 유지하고 표면/텍스트만 반전 */
  :root[data-theme="light"] {
    color-scheme: light;
    --canvas:         #f1eefc;
    --surface-indigo: #ffffff;
    --surface-onyx:   #f2effa;
    --ink:            #14162b;
    --ink-dark:       #ffffff;
    --muted:          rgba(20,22,43,0.6);
    --hairline:       #e4e0f5;
    --shadow-soft:    0 3px 40px rgba(88,101,242,0.18);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; color: var(--ink); font-family: var(--font-sans); }
  body {
    background:
      radial-gradient(circle at 12% -10%, rgba(88,101,242,0.4), transparent 45%),
      radial-gradient(circle at 90% 10%, rgba(236,72,189,0.3), transparent 50%),
      radial-gradient(circle at 50% 120%, rgba(88,101,242,0.25), transparent 55%),
      var(--canvas);
    background-attachment: fixed;
    background-size: 180% 180%;
    animation: aurora-move 24s ease-in-out infinite alternate;
    transition: background-color 0.3s ease;
  }
  :root[data-theme="light"] body {
    background:
      radial-gradient(circle at 12% -10%, rgba(88,101,242,0.16), transparent 45%),
      radial-gradient(circle at 90% 10%, rgba(236,72,189,0.14), transparent 50%),
      radial-gradient(circle at 50% 120%, rgba(88,101,242,0.12), transparent 55%),
      var(--canvas);
    background-attachment: fixed;
    background-size: 180% 180%;
  }
  @keyframes aurora-move {
    0%   { background-position: 0% 0%, 100% 0%, 50% 100%; }
    100% { background-position: 20% 15%, 75% 25%, 35% 85%; }
  }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 24px 20px 48px; }

  .topbar {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    background: var(--surface-indigo); border-radius: var(--radius-control);
    padding: 20px 24px; margin-bottom: 20px;
  }
  .topbar .date { font-size: 14px; color: var(--muted); margin-bottom: 6px; font-family: var(--font-sans); }
  .topbar .greeting {
    font-size: 26px; font-weight: 800; letter-spacing: 0.3px; line-height: 1.1;
    font-family: var(--font-display); text-transform: uppercase; color: var(--ink);
  }
  .theme-toggle {
    background: var(--surface-onyx); border: none; color: var(--ink); font-size: 18px;
    width: 40px; height: 40px; border-radius: 50%; cursor: pointer; flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center; transition: transform 0.2s ease;
  }
  .theme-toggle:hover { transform: rotate(15deg); }

  /* 오늘의 요약 */
  .summary-grid { display: flex; gap: 16px; flex-wrap: wrap; }
  .summary-item { flex: 1 1 160px; background: var(--surface-onyx); border-radius: var(--radius-chip); padding: 16px 18px; }
  .summary-value { font-size: 26px; font-weight: 800; font-family: var(--font-display); }
  .summary-value.up { color: var(--green); }
  .summary-value.down { color: var(--magenta); }
  .summary-label { font-size: 13px; color: var(--muted); margin-top: 4px; }

  /* 티커 테이프 */
  .ticker { background: var(--surface-onyx); border-radius: var(--radius-pill); padding: 10px 0; margin-bottom: 20px; overflow: hidden; white-space: nowrap; display: none; }
  .ticker-track { display: inline-flex; gap: 32px; padding-left: 32px; animation: ticker-scroll 20s linear infinite; }
  .ticker:hover .ticker-track { animation-play-state: paused; }
  .ticker-item { font-size: 14px; font-weight: 600; font-family: var(--font-sans); color: var(--ink); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .ticker-item .chg-up { color: var(--green); }
  .ticker-item .chg-down { color: var(--magenta); }
  @keyframes ticker-scroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
  @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } }

  .card {
    background: var(--surface-indigo); border: none; border-radius: var(--radius-card);
    padding: 28px 32px 32px; margin-bottom: 20px; transition: box-shadow 0.25s ease, transform 0.25s ease;
  }
  .card:hover { box-shadow: 0 8px 40px rgba(88,101,242,0.45), 0 3px 68px rgba(236,72,189,0.22); transform: translateY(-2px); }
  .card h2 {
    font-family: var(--font-display); font-size: 20px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.4px; margin: 0 0 16px; color: var(--ink);
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .card h2 .count {
    font-size: 13px; font-weight: 500; font-family: var(--font-sans); text-transform: none;
    letter-spacing: 0; color: var(--ink); background: var(--magenta);
    border-radius: var(--radius-chip); padding: 4px 12px;
  }

  .add-row { display: flex; gap: 8px; margin-bottom: 16px; }
  .add-row input { flex: 1; min-width: 0; }
  input[type="text"], input[type="number"] {
    background: var(--surface-onyx); border: none; border-radius: var(--radius-control);
    padding: 12px 16px; font-size: 14px; color: var(--ink); font-family: var(--font-sans);
    transition: box-shadow 0.15s ease;
  }
  input[type="text"]::placeholder, input[type="number"]::placeholder { color: var(--muted); }
  input[type="text"]:focus, input[type="number"]:focus { outline: none; box-shadow: 0 0 0 2px var(--primary); }
  .btn {
    border: none; border-radius: var(--radius-btn); padding: 12px 22px; font-size: 15px; font-weight: 500;
    cursor: pointer; background: var(--primary); color: var(--on-primary); flex: 0 0 auto;
    font-family: var(--font-sans); transition: filter 0.15s ease;
  }
  .btn:hover { filter: brightness(1.12); }
  .btn:disabled { opacity: 0.6; cursor: default; }
  .btn-ghost {
    background: var(--surface-onyx); border: none; color: var(--ink);
    font-weight: 500; padding: 7px 14px; font-size: 13px; border-radius: 6px; cursor: pointer;
    font-family: var(--font-sans); transition: color 0.15s ease;
  }
  .btn-ghost:hover { color: var(--magenta); }

  .empty { color: var(--muted); font-size: 14px; padding: 10px 2px; }

  /* 자동완성 */
  .autocomplete-wrap { position: relative; flex: 1; min-width: 0; }
  .autocomplete-wrap input { width: 100%; }
  .autocomplete-list {
    position: absolute; top: calc(100% + 4px); left: 0; right: 0; background: var(--surface-onyx);
    border-radius: var(--radius-control); box-shadow: var(--shadow-soft); z-index: 30;
    max-height: 220px; overflow-y: auto; display: none;
  }
  .autocomplete-list.open { display: block; }
  .autocomplete-item { padding: 10px 14px; font-size: 13px; cursor: pointer; display: flex; justify-content: space-between; gap: 10px; }
  .autocomplete-item:hover { background: rgba(88,101,242,0.25); }
  .autocomplete-item .ac-code { color: var(--muted); font-size: 12px; }

  /* 상세 입력 토글 */
  .advanced-toggle { background: none; border: none; color: var(--link); font-size: 13px; cursor: pointer; padding: 0; margin-bottom: 12px; font-family: var(--font-sans); }
  .advanced-toggle:hover { text-decoration: underline; }
  .advanced-row { display: none; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .advanced-row.open { display: flex; }
  .advanced-row input { flex: 1 1 110px; min-width: 0; }

  /* 정렬 · 태그 필터 */
  .stock-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .stock-toolbar-left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .sort-select {
    background: var(--surface-onyx); border: none; border-radius: var(--radius-chip);
    padding: 8px 12px; font-size: 13px; color: var(--ink); font-family: var(--font-sans); cursor: pointer;
  }
  .tag-filters { display: flex; gap: 6px; flex-wrap: wrap; }
  .tag-chip {
    background: var(--surface-onyx); border: none; color: var(--muted); font-size: 12px;
    padding: 5px 12px; border-radius: var(--radius-pill); cursor: pointer; font-family: var(--font-sans);
    transition: background 0.15s ease, color 0.15s ease;
  }
  .tag-chip.active { background: var(--primary); color: var(--on-primary); }

  .stock-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .stock-card {
    display: flex; flex-direction: column; gap: 8px;
    background: var(--surface-onyx); border-radius: var(--radius-chip); padding: 12px 16px;
  }
  .stock-card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .stock-name { font-size: 16px; font-weight: 500; color: var(--ink); font-family: var(--font-sans); }
  .stock-code { font-size: 13px; color: var(--muted); margin-left: 8px; font-weight: 400; }
  .stock-tag { font-size: 11px; font-weight: 600; background: rgba(88,101,242,0.28); color: var(--link); padding: 2px 9px; border-radius: var(--radius-pill); margin-left: 8px; }
  .stock-return { font-size: 13px; font-weight: 700; margin-left: 8px; }
  .stock-return.up { color: var(--green); }
  .stock-return.down { color: var(--magenta); }
  .stock-actions { display: flex; gap: 6px; flex: 0 0 auto; }
  .stock-prices { font-size: 12px; color: var(--muted); }
  .gauge-track { background: rgba(255,255,255,0.08); border-radius: var(--radius-pill); height: 6px; overflow: hidden; }
  .gauge-fill { height: 100%; background: linear-gradient(90deg, var(--primary), var(--magenta)); border-radius: var(--radius-pill); transition: width 0.4s ease; }
  .sparkline { display: block; }
  .price-edit-row { display: none; gap: 6px; flex-wrap: wrap; padding-top: 4px; border-top: 1px solid rgba(255,255,255,0.08); }
  .price-edit-row.open { display: flex; }
  .price-edit-row input { flex: 1 1 90px; min-width: 0; font-size: 12px; padding: 8px 10px; }

  /* 도넛 차트 */
  .donut-wrap { display: none; align-items: center; gap: 24px; margin-top: 18px; flex-wrap: wrap; }
  .donut-legend { display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
  .donut-legend-item { display: flex; align-items: center; gap: 8px; }
  .donut-swatch { width: 10px; height: 10px; border-radius: 3px; flex: 0 0 auto; }

  textarea#memo {
    width: 100%; min-height: 140px; resize: vertical; background: var(--surface-onyx);
    border: none; border-radius: var(--radius-control); padding: 12px 16px;
    font-size: 14px; color: var(--ink); font-family: var(--font-sans); line-height: 1.6;
    transition: box-shadow 0.15s ease;
  }
  textarea#memo::placeholder { color: var(--muted); }
  textarea#memo:focus { outline: none; box-shadow: 0 0 0 2px var(--primary); }
  .save-state { font-size: 13px; color: var(--muted); margin-top: 8px; height: 14px; }

  .check-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .check-item { display: flex; align-items: center; gap: 10px; background: var(--surface-onyx); border-radius: var(--radius-chip); padding: 12px 16px; }
  .check-item input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--green); flex: 0 0 auto; cursor: pointer; }
  .check-text { flex: 1; font-size: 14px; color: var(--ink); font-family: var(--font-sans); }
  .check-item.done .check-text { color: var(--muted); text-decoration: line-through; }

  .macro-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .macro-item { background: var(--surface-onyx); border-radius: var(--radius-chip); padding: 16px; }
  .macro-title { font-family: var(--font-display); font-size: 17px; font-weight: 700; color: var(--ink); margin-bottom: 4px; display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
  .macro-desc { font-size: 14px; color: var(--ink); opacity: 0.85; line-height: 1.6; margin-bottom: 8px; font-family: var(--font-sans); }
  .macro-source { font-size: 13px; font-family: var(--font-sans); }
  .macro-source .label { color: var(--muted); margin-right: 4px; }
  .macro-source a { color: var(--link); text-decoration: none; word-break: break-all; font-weight: 500; }
  .macro-source a:hover { text-decoration: underline; }
  .macro-note { font-size: 12px; color: var(--muted); margin-top: 6px; font-family: var(--font-sans); }

  .dday-badge { display: inline-block; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: var(--radius-pill); background: var(--primary); color: var(--on-primary); }
  .dday-badge.soon { background: var(--magenta); }
  .dday-badge.today { background: var(--green); color: var(--ink-dark); }

  /* 토스트 */
  .toast-container { position: fixed; right: 20px; bottom: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 999; }
  .toast {
    background: var(--surface-onyx); color: var(--ink); border-radius: var(--radius-chip);
    padding: 12px 18px; font-size: 14px; font-family: var(--font-sans); box-shadow: var(--shadow-soft);
    border-left: 4px solid var(--primary); animation: toast-in 0.25s ease;
  }
  .toast.toast-error { border-left-color: var(--magenta); }
  .toast.toast-out { animation: toast-out 0.25s ease forwards; }
  .toast.toast-undo { display: flex; align-items: center; gap: 14px; }
  .toast-undo-btn {
    background: none; border: none; color: var(--link); font-weight: 700; font-size: 13px;
    cursor: pointer; padding: 0; font-family: var(--font-sans); flex: 0 0 auto;
  }
  .toast-undo-btn:hover { text-decoration: underline; }
  @keyframes toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes toast-out { to { opacity: 0; transform: translateY(8px); } }

  /* 가격 기록 펼치기 */
  .history-toggle { background: none; border: none; color: var(--link); font-size: 12px; cursor: pointer; padding: 0; font-family: var(--font-sans); }
  .history-toggle:hover { text-decoration: underline; }
  .history-list { display: none; list-style: none; margin: 0; padding: 0; font-size: 12px; color: var(--muted); }
  .history-list.open { display: block; }
  .history-list li { display: flex; justify-content: space-between; padding: 2px 0; }

  /* 종목 메모 */
  .stock-note { font-size: 12px; color: var(--muted); font-style: italic; }

  /* 드래그 정렬 */
  .drag-handle { cursor: grab; color: var(--muted); margin-right: 8px; font-size: 14px; user-select: none; }
  .stock-card[draggable="true"] .stock-name { cursor: default; }
  .stock-card.dragging { opacity: 0.45; }
  .stock-card.drag-over { outline: 2px dashed var(--primary); outline-offset: 2px; }

  /* 체크리스트 우선순위 */
  .check-item.priority-high { border-left: 3px solid var(--magenta); }
  .priority-select {
    background: var(--surface-onyx); border: none; border-radius: var(--radius-chip);
    padding: 12px 10px; font-size: 13px; color: var(--ink); font-family: var(--font-sans); cursor: pointer; flex: 0 0 auto;
  }
  .priority-badge {
    font-size: 11px; font-weight: 700; background: var(--magenta); color: var(--on-primary);
    padding: 2px 8px; border-radius: var(--radius-pill); margin-left: 6px;
  }

  /* 메모 미리보기 */
  .memo-toolbar { display: flex; justify-content: flex-end; margin-bottom: 8px; }
  #memoPreview {
    display: none; min-height: 140px; background: var(--surface-onyx); border-radius: var(--radius-control);
    padding: 12px 16px; font-size: 14px; line-height: 1.6; white-space: pre-wrap; word-break: break-word;
  }
  #memoPreview.open { display: block; }
  #memoPreview ul { margin: 4px 0; padding-left: 20px; }

  .file-hidden { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div>
      <div class="date" id="todayDate"></div>
      <div class="greeting" id="greeting"></div>
    </div>
    <button class="theme-toggle" id="themeToggleBtn" type="button" title="테마 전환">🌙</button>
  </div>

  <div class="ticker" id="tickerBar">
    <div class="ticker-track" id="tickerTrack"></div>
  </div>

  <div class="card">
    <h2>오늘의 요약</h2>
    <div class="summary-grid" id="summaryGrid"></div>
  </div>

  <div class="card">
    <h2>오늘의 매크로 이슈 <span class="count" id="macroDateLabel"></span></h2>
    <ul class="macro-list" id="macroList"></ul>
    <div class="macro-note">공개 출처 기준으로 정리한 정적 스냅샷입니다. 최신 이슈로 갱신하려면 다시 요청해주세요.</div>
  </div>

  <div class="grid">
    <!-- 좌측: 관심종목 -->
    <div class="card">
      <h2>관심종목 <span class="count" id="stockCount"></span></h2>
      <div class="add-row">
        <div class="autocomplete-wrap">
          <input type="text" id="stockNameInput" placeholder="종목명 (예: 삼성전자)" autocomplete="off">
          <div class="autocomplete-list" id="stockAutocomplete"></div>
        </div>
        <input type="text" id="stockCodeInput" placeholder="종목코드 (선택)" style="flex: 0 0 120px;">
        <button class="btn" id="addStockBtn" type="button">추가</button>
      </div>
      <button class="advanced-toggle" id="advancedToggleBtn" type="button">상세 입력 (태그·가격) ▾</button>
      <div class="advanced-row" id="advancedRow">
        <input type="text" id="stockTagInput" placeholder="태그 (예: 매수후보)">
        <input type="number" id="stockPurchaseInput" placeholder="매입가" step="0.01">
        <input type="number" id="stockCurrentInput" placeholder="현재가" step="0.01">
        <input type="number" id="stockTargetInput" placeholder="목표가" step="0.01">
      </div>
      <div class="stock-toolbar">
        <div class="stock-toolbar-left">
          <select class="sort-select" id="sortSelect">
            <option value="default">추가순</option>
            <option value="name">이름순</option>
            <option value="return">수익률순</option>
          </select>
          <div class="tag-filters" id="tagFilters"></div>
        </div>
        <div style="display:flex; gap:6px; flex-wrap:wrap;">
          <button class="btn-ghost" id="copyStocksBtn" type="button">텍스트로 복사</button>
          <button class="btn-ghost" id="exportCsvBtn" type="button">CSV 내보내기</button>
          <button class="btn-ghost" id="importCsvBtn" type="button">CSV 가져오기</button>
          <input type="file" id="importCsvInput" class="file-hidden" accept=".csv">
        </div>
      </div>
      <ul class="stock-list" id="stockList"></ul>
      <div class="donut-wrap" id="stockDonutWrap">
        <svg id="stockDonut" width="120" height="120" viewBox="0 0 120 120"></svg>
        <div class="donut-legend" id="donutLegend"></div>
      </div>
    </div>

    <!-- 우측: 메모 + 체크리스트 -->
    <div>
      <div class="card">
        <h2>메모</h2>
        <div class="memo-toolbar">
          <button class="btn-ghost" id="memoPreviewBtn" type="button">미리보기</button>
        </div>
        <div id="memoPreview"></div>
        <textarea id="memo" placeholder="오늘 챙길 것, 생각날 때 바로 적어두세요. **굵게**, '- 목록' 문법을 지원해요."></textarea>
        <div class="save-state" id="memoSaveState"></div>
      </div>

      <div class="card">
        <h2>오늘의 체크리스트 <span class="count" id="checkCount"></span></h2>
        <div class="add-row">
          <input type="text" id="checkInput" placeholder="할 일 추가">
          <select class="priority-select" id="checkPriorityInput">
            <option value="normal">보통</option>
            <option value="high">높음</option>
          </select>
          <button class="btn" id="addCheckBtn" type="button">추가</button>
        </div>
        <ul class="check-list" id="checkList"></ul>
      </div>
    </div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script>
(function () {
  "use strict";

  var LS_MEMO = "dash-memo";

  function csvEscape(v) {
    v = v == null ? "" : String(v);
    if (/[",\n]/.test(v)) v = '"' + v.replace(/"/g, '""') + '"';
    return v;
  }
  function parseCSVLine(line) {
    var result = [];
    var cur = "";
    var inQuotes = false;
    for (var i = 0; i < line.length; i++) {
      var ch = line[i];
      if (inQuotes) {
        if (ch === '"') {
          if (line[i + 1] === '"') { cur += '"'; i++; } else { inQuotes = false; }
        } else {
          cur += ch;
        }
      } else if (ch === '"') {
        inQuotes = true;
      } else if (ch === ",") {
        result.push(cur);
        cur = "";
      } else {
        cur += ch;
      }
    }
    result.push(cur);
    return result;
  }
  function parseCSV(text) {
    var lines = text.split(/\r\n|\n/).filter(function (l) { return l.trim() !== ""; });
    if (!lines.length) return [];
    var rows = lines.map(parseCSVLine);
    var header = rows[0].map(function (h) { return h.trim(); });
    return rows.slice(1).map(function (cols) {
      var obj = {};
      header.forEach(function (h, i) { obj[h] = cols[i] !== undefined ? cols[i] : ""; });
      return obj;
    });
  }

  function computeDday(eventDateStr) {
    if (!eventDateStr) return null;
    var today = new Date();
    today.setHours(0, 0, 0, 0);
    var parts = eventDateStr.split("-");
    var ev = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
    var diffDays = Math.round((ev - today) / 86400000);
    if (diffDays === 0) return { text: "D-DAY", cls: "today" };
    if (diffDays > 0) return { text: "D-" + diffDays, cls: diffDays <= 3 ? "soon" : "" };
    return { text: "D+" + Math.abs(diffDays), cls: "" };
  }

  function computeReturn(s) {
    if (s.purchase_price != null && s.current_price != null && s.purchase_price !== 0) {
      return (s.current_price - s.purchase_price) / s.purchase_price * 100;
    }
    return null;
  }

  function applyFilterSort(list) {
    var out = list.slice();
    if (filterTag) {
      out = out.filter(function (s) { return (s.tag || "미분류") === filterTag; });
    }
    if (sortMode === "name") {
      out.sort(function (a, b) { return a.name.localeCompare(b.name, "ko"); });
    } else if (sortMode === "return") {
      out.sort(function (a, b) {
        var ra = computeReturn(a); var rb = computeReturn(b);
        ra = ra === null ? -Infinity : ra;
        rb = rb === null ? -Infinity : rb;
        return rb - ra;
      });
    }
    return out;
  }

  function renderDonut() {
    var wrap = document.getElementById("stockDonutWrap");
    var svg = document.getElementById("stockDonut");
    var legend = document.getElementById("donutLegend");
    svg.innerHTML = "";
    legend.innerHTML = "";

    if (!stocks.length) {
      wrap.style.display = "none";
      return;
    }
    wrap.style.display = "flex";

    var counts = {};
    stocks.forEach(function (s) {
      var t = s.tag || "미분류";
      counts[t] = (counts[t] || 0) + 1;
    });
    var palette = ["#5865f2", "#ec48bd", "#35ed7e", "#00b0f4", "#f2a65a", "#a05dfc"];
    var tags = Object.keys(counts);
    var total = stocks.length;
    var svgNS = "http://www.w3.org/2000/svg";
    var cx = 60, cy = 60, r = 48;
    var circumference = 2 * Math.PI * r;
    var offset = 0;

    tags.forEach(function (t, i) {
      var color = palette[i % palette.length];
      var frac = counts[t] / total;
      var circle = document.createElementNS(svgNS, "circle");
      circle.setAttribute("cx", cx);
      circle.setAttribute("cy", cy);
      circle.setAttribute("r", r);
      circle.setAttribute("fill", "none");
      circle.setAttribute("stroke", color);
      circle.setAttribute("stroke-width", "16");
      circle.setAttribute("stroke-dasharray", (frac * circumference).toFixed(1) + " " + circumference.toFixed(1));
      circle.setAttribute("stroke-dashoffset", (-offset).toFixed(1));
      circle.setAttribute("transform", "rotate(-90 " + cx + " " + cy + ")");
      svg.appendChild(circle);
      offset += frac * circumference;

      var item = document.createElement("div");
      item.className = "donut-legend-item";
      var sw = document.createElement("span");
      sw.className = "donut-swatch";
      sw.style.background = color;
      var labelEl = document.createElement("span");
      labelEl.textContent = t + " " + counts[t] + "개";
      item.appendChild(sw);
      item.appendChild(labelEl);
      legend.appendChild(item);
    });
  }

  function renderSparkline(history) {
    if (!history || history.length < 2) return null;
    var w = 160, h = 32, pad = 2;
    var prices = history.map(function (pt) { return pt.p; });
    var min = Math.min.apply(null, prices);
    var max = Math.max.apply(null, prices);
    var range = (max - min) || 1;
    var svgNS = "http://www.w3.org/2000/svg";
    var svg = document.createElementNS(svgNS, "svg");
    svg.setAttribute("class", "sparkline");
    svg.setAttribute("width", w);
    svg.setAttribute("height", h);
    svg.setAttribute("viewBox", "0 0 " + w + " " + h);

    var points = prices.map(function (p, i) {
      var x = pad + (i / (prices.length - 1)) * (w - pad * 2);
      var y = h - pad - ((p - min) / range) * (h - pad * 2);
      return x.toFixed(1) + "," + y.toFixed(1);
    }).join(" ");

    var poly = document.createElementNS(svgNS, "polyline");
    poly.setAttribute("points", points);
    poly.setAttribute("fill", "none");
    poly.setAttribute("stroke", prices[prices.length - 1] >= prices[0] ? "#35ed7e" : "#ec48bd");
    poly.setAttribute("stroke-width", "2");
    poly.setAttribute("stroke-linecap", "round");
    poly.setAttribute("stroke-linejoin", "round");
    svg.appendChild(poly);
    return svg;
  }

  function appendPricePoint(history, price) {
    var hist = (history || []).slice();
    var today = todayISO();
    if (hist.length && hist[hist.length - 1].d === today) {
      hist[hist.length - 1] = { d: today, p: price };
    } else {
      hist.push({ d: today, p: price });
    }
    if (hist.length > 20) hist = hist.slice(hist.length - 20);
    return hist;
  }

          var toIdx = stocks.findIndex(function (x) { return x.id === s.id; });
          if (fromIdx === -1 || toIdx === -1) return;
          var moved = stocks.splice(fromIdx, 1)[0];
          stocks.splice(toIdx, 0, moved);

          renderStocks();

      targetInput.placeholder = "목표가";
      targetInput.value = s.target_price != null ? s.target_price : "";

      noteInput.type = "text";

      noteInput.value = s.note || "";

  function addStock() {
    var nameInput = document.getElementById("stockNameInput");
    var codeInput = document.getElementById("stockCodeInput");
    var addBtn = document.getElementById("addStockBtn");
    var name = nameInput.value.trim();
    var code = codeInput.value.trim();

      return;
    }
    var tag = document.getElementById("stockTagInput").value.trim();
    var purchase = parseNum(document.getElementById("stockPurchaseInput").value);
    var current = parseNum(document.getElementById("stockCurrentInput").value);
    var target = parseNum(document.getElementById("stockTargetInput").value);

    var payload = {
      name: name,
      code: code || null,
      tag: tag || null,
      purchase_price: purchase,
      current_price: current,
      target_price: target,
      price_history: current != null ? [{ d: todayISO(), p: current }] : [],
      sort_order: stocks.length
    };

    stocksError = "";

    insertStock(payload).then(function (row) {
      stocks.push(row);
      nameInput.value = "";
      codeInput.value = "";
      resetAdvancedInputs();
      nameInput.focus();
      showToast(name + " 추가됨");
      renderStocks();

      showToast("종목 추가에 실패했습니다.", "error");

    }).finally(function () {

      return;
    }
    var header = ["name", "code", "tag", "purchase_price", "current_price", "target_price", "note"];
    var rows = stocks.map(function (s) {
      return [
        s.name, s.code || "", s.tag || "",
        s.purchase_price != null ? s.purchase_price : "",
        s.current_price != null ? s.current_price : "",
        s.target_price != null ? s.target_price : "",
        s.note || ""
      ].map(csvEscape).join(",");
    });
    var csv = [header.join(",")].concat(rows).join("\n");
    var blob = new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8;" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "관심종목_" + todayISO() + ".csv";
    document.body.appendChild(a);

  document.getElementById("importCsvInput").addEventListener("change", function (e) {
    var file = e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      var rows = parseCSV(String(reader.result));
      var validRows = rows.filter(function (r) { return r.name && r.name.trim(); });
      if (!validRows.length) {
        showToast("가져올 유효한 데이터가 없습니다. (name 열 확인)", "error");
        e.target.value = "";
        return;
      }
      var successCount = 0;
      var chain = Promise.resolve();
      validRows.forEach(function (r) {
        chain = chain.then(function () {
          var current = parseNum(r.current_price);
          return insertStock({
            name: r.name.trim(),
            code: (r.code || "").trim() || null,
            tag: (r.tag || "").trim() || null,
            note: (r.note || "").trim() || null,
            purchase_price: parseNum(r.purchase_price),
            current_price: current,
            target_price: parseNum(r.target_price),
            price_history: current != null ? [{ d: todayISO(), p: current }] : [],
            sort_order: stocks.length
          }).then(function (row) {
            stocks.push(row);
            successCount++;
          }).catch(function () { /* 개별 행 실패는 건너뛰고 계속 진행 */ });
        });
      });
      chain.then(function () {
        renderStocks();
        showToast(successCount + "개 종목을 가져왔습니다.");
        e.target.value = "";
      });
    };
    reader.readAsText(file, "utf-8");
  });

    matches.forEach(function (m) {
      var item = document.createElement("div");
      item.className = "autocomplete-item";
      var nameSpan = document.createElement("span");
      nameSpan.textContent = m.name;
      var codeSpan = document.createElement("span");
      codeSpan.className = "ac-code";
      codeSpan.textContent = m.code;
      item.appendChild(nameSpan);
      item.appendChild(codeSpan);
      item.addEventListener("click", function () {
        nameInputEl.value = m.name;
        document.getElementById("stockCodeInput").value = m.code;
        acListEl.classList.remove("open");
        nameInputEl.focus();
      });
      acListEl.appendChild(item);
    });
    acListEl.classList.add("open");
  });
  document.addEventListener("click", function (e) {
    if (!e.target.closest(".autocomplete-wrap")) {
      acListEl.classList.remove("open");
    }
  });

  // ---------- 메모 (자동 저장) ----------
  var memoEl = document.getElementById("memo");
  var memoSaveState = document.getElementById("memoSaveState");
  var memoPreviewEl = document.getElementById("memoPreview");
  var memoPreviewBtn = document.getElementById("memoPreviewBtn");
  memoEl.value = load(LS_MEMO, "");

  var memoTimer = null;
  memoEl.addEventListener("input", function () {
    memoSaveState.textContent = "저장 중...";
    clearTimeout(memoTimer);
    memoTimer = setTimeout(function () {
      localStorage.setItem(LS_MEMO, memoEl.value);
      memoSaveState.textContent = "저장됨";
      setTimeout(function () {
        if (memoSaveState.textContent === "저장됨") memoSaveState.textContent = "";
      }, 1500);
    }, 400);
  });

  function renderMarkdown(text) {
    var escaped = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    var lines = escaped.split("\n");
    var html = "";
    var inList = false;
    lines.forEach(function (line) {
      var isListItem = /^-\s+/.test(line);
      if (isListItem) {
        if (!inList) { html += "<ul>"; inList = true; }
        html += "<li>" + line.replace(/^-\s+/, "") + "</li>";
      } else {
        if (inList) { html += "</ul>"; inList = false; }
        html += line === "" ? "<br>" : "<div>" + line + "</div>";
      }
    });
    if (inList) html += "</ul>";
    html = html.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    return html;
  }

  memoPreviewBtn.addEventListener("click", function () {
    var open = memoPreviewEl.classList.toggle("open");
    if (open) {
      memoPreviewEl.innerHTML = renderMarkdown(memoEl.value);
      memoEl.style.display = "none";
      memoPreviewBtn.textContent = "편집하기";
    } else {
      memoEl.style.display = "";
      memoPreviewBtn.textContent = "미리보기";
    }
  });

  // ---------- 오늘의 체크리스트 ----------
  function renderChecks() {
    var list = document.getElementById("checkList");
    list.innerHTML = "";
    var doneCount = checks.filter(function (c) { return c.done; }).length;
    document.getElementById("checkCount").textContent = checks.length ? (doneCount + "/" + checks.length) : "";
    renderSummary();

    if (!checks.length) {
      var empty = document.createElement("li");
      empty.className = "empty";
      empty.textContent = "오늘 할 일을 추가해보세요.";
      list.appendChild(empty);
      return;
    }

    checks.forEach(function (c) {
      var li = document.createElement("li");
      li.className = "check-item" + (c.done ? " done" : "") + (c.priority === "high" ? " priority-high" : "");

      var checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.checked = !!c.done;
      checkbox.addEventListener("change", function () {
        c.done = checkbox.checked;
        save(LS_CHECKS, checks);
        renderChecks();
      });

      var text = document.createElement("span");
      text.className = "check-text";
      text.textContent = c.text;

      var delBtn = document.createElement("button");
      delBtn.className = "btn-ghost";
      delBtn.type = "button";
      delBtn.textContent = "삭제";
      delBtn.addEventListener("click", function () {
        checks = checks.filter(function (x) { return x.id !== c.id; });
        save(LS_CHECKS, checks);
        renderChecks();
      });

      li.appendChild(checkbox);
      li.appendChild(text);
      if (c.priority === "high") {
        var badge = document.createElement("span");
        badge.className = "priority-badge";
        badge.textContent = "높음";
        li.appendChild(badge);
      }
      li.appendChild(delBtn);
      list.appendChild(li);
    });
  }

  function addCheck() {
    var input = document.getElementById("checkInput");
    var prioritySel = document.getElementById("checkPriorityInput");
    var textVal = input.value.trim();
    if (!textVal) {
      input.focus();
      return;
    }
    checks.push({ id: uid(), text: textVal, done: false, priority: prioritySel.value });
    save(LS_CHECKS, checks);
    input.value = "";
    prioritySel.value = "normal";
    input.focus();
    renderChecks();
  }

  document.getElementById("addCheckBtn").addEventListener("click", addCheck);
  document.getElementById("checkInput").addEventListener("keydown", function (e) {
    if (e.key === "Enter") addCheck();
  });

  // ---------- 초기 렌더 ----------
  renderHeader();
  renderMacro();
  renderStocks();
  renderChecks();

  fetchStocks().then(function (rows) {
    stocks = rows;
    stocksLoading = false;
    renderStocks();
  }).catch(function () {
    stocksLoading = false;
    stocksError = "관심종목을 불러오지 못했습니다. 새로고침 해주세요.";
    renderStocks();
  });

  fetchMarketData();
})();
</script>
</body>
</html>
